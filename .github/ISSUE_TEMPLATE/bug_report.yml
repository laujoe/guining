name: 问题反馈
description: 报告归宁的错误或操作障碍
body:
  - type: input
    id: version
    attributes:
      label: 游戏版本与下载文件名
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 系统、设备与显卡
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请说明所在章节、操作、预期结果与实际结果。截图和日志请隐去个人信息。
    validations:
      required: true
